name: Build

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ScannerSuite.csproj

      # EnableWindowsTargeting in the csproj lets the Linux job build a
      # net8.0-windows project. The app itself only runs on Windows.
      - name: Build
        run: dotnet build ScannerSuite.csproj --configuration Release --no-restore
